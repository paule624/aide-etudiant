name: Sync aides locales

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync:aides
      - run: pnpm typecheck
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/sync-aides-locales
          commit-message: "chore: sync aides locales from betagouv/aides-jeunes"
          title: "chore: mise à jour des aides locales (aides-jeunes)"
          body: "Synchronisation automatique de `src/data/aides-locales.json` depuis [betagouv/aides-jeunes](https://github.com/betagouv/aides-jeunes)."
          add-paths: src/data/aides-locales.json
